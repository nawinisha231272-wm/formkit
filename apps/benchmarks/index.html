<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OurForm benchmarks</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 2rem;
      }
      button,
      select {
        font: inherit;
        padding: 0.5rem;
      }
      pre {
        white-space: pre-wrap;
      }
      #form {
        height: 25rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Runtime benchmarks</h1>
    <p>
      Built packages · real controls · median timings. Keep this tab foreground
      for measurements.
    </p>
    <label
      >Fields
      <select id="count">
        <option>100</option>
        <option selected>500</option>
        <option>1000</option>
      </select></label
    >
    <button id="run">Run benchmark</button>
    <pre id="result" aria-live="polite">Ready</pre>
    <div id="form"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
