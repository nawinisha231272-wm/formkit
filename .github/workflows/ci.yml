name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OURFORM_CI_RUNNER_TYPE: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pinned container and browser package match
        run: |
          node -e 'const p=require("./scripts/playwright-container.json"); const v=require("./package.json").devDependencies["@playwright/test"]; if(p.playwright!==v || process.platform!=="linux" || process.arch!=="x64") process.exit(1)'
      - name: Match browser home ownership to the container user
        # Actions mounts a home owned by pwuser while this image runs as root.
        # Firefox requires matching ownership; retain HOME and browser sandbox settings.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Check clean checkout provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
      - name: Verify correctness, accessibility and the 500-field performance budget
        run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
